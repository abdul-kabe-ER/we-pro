<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ClinicQ – Appointment & Queue System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top"><b>🩺 ClinicQ</b>
        <nav id="nav" aria-label="Main"></nav><span id="who"></span><button id="logout" hidden>Logout</button>
    </header>
    <main id="main" aria-live="polite"></main>
    <div id="toast" role="status"></div>
    <dialog id="dlg">
        <form method="dialog" id="dform" novalidate>
            <h2 id="dtitle"></h2>
            <div id="dbody"></div>
            <p class="err" id="derr"></p>
            <div class="row"><button type="button" class="ghost" id="dcancel">Cancel</button><button type="submit"
                    id="dok">Submit</button></div>
        </form>
    </dialog>
    <script src="mockapi.js"></script>
    <script src="app.js"></script>
</body>

</html>
